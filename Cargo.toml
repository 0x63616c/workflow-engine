[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates.
wfe-core = { path = "crates/core" }
wfe-lsm = { path = "crates/lsm" }
wfe-vsr = { path = "crates/vsr" }
wfe-engine = { path = "crates/engine" }
wfe-gateway = { path = "crates/gateway" }
wfe-sdk = { path = "crates/sdk" }
wfe-codec = { path = "crates/codec" }
wfe-sim = { path = "crates/sim" }
wfe-server = { path = "crates/server" }
wfe-ui = { path = "crates/ui" }
wfe-operator = { path = "crates/operator" }
wfe-control = { path = "crates/control" }

# Deterministic-core dependencies (no I/O, no clocks, no threads).
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
rmp-serde = "1.3"
blake3 = "1.8"
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
lz4_flex = "0.14"

# Shell dependencies (real I/O; never used by the deterministic core).
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
clap = { version = "4", features = ["derive", "env"] }
maud = { version = "0.27", features = ["axum"] }
kube = { version = "5", features = ["runtime", "derive"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
k8s-openapi = { version = "0.29", features = ["v1_33"] }
schemars = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unwrap_used = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
overflow-checks = true

# Simulation runs are CPU bound; this profile is what the always-on fuzzer uses.
[profile.sim]
inherits = "release"
debug-assertions = true
overflow-checks = true
