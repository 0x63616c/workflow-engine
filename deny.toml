[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "anyhow", wrappers = ["wfe-cli", "wfe-server", "wfe-ui", "wfe-operator"], reason = "libraries return typed errors (wfe_core::Error or a thiserror enum) so callers can match on them. anyhow is only for binaries and service entry points." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
